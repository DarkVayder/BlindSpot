name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm release:pack
      - run: pnpm release:smoke release/*.tgz
        shell: bash
      - name: Check the action bundle matches the source
        shell: bash
        run: |
          node scripts/action-build.js
          git diff --exit-code -- packages/action/bundle
      - run: pnpm audit --prod --audit-level high

  # Runs the committed action bundle against this repository, the way users run it.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: blindspot
        uses: ./
        with:
          top: "5"
      - name: Check the outputs
        shell: bash
        env:
          REPORT_JSON: ${{ steps.blindspot.outputs.report-json }}
          REPORT_HTML: ${{ steps.blindspot.outputs.report-html }}
          RANKED: ${{ steps.blindspot.outputs.ranked-files }}
          GATE: ${{ steps.blindspot.outputs.gate }}
        run: |
          test -s "$REPORT_JSON"
          test -s "$REPORT_HTML"
          test "$GATE" = off
          test "$RANKED" -gt 0
          echo "Ranked files: $RANKED"
